name: Pollixir CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/website

      - name: Run eslint for Web app
        run: npm run lint
        working-directory: ./apps/website




      
        
